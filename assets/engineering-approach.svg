<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc">
 <title id="title">Engineering approach: Understand, Assess, Engineer, Assure</title>
 <desc id="desc">Four linked stages: understand systems, functions, assets and interfaces; assess threats, vulnerabilities, likelihood and risk; engineer architecture, controls, zones and conduits; assure through review, testing and evidence.</desc>
