<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1090" viewBox="0 0 640 1090" role="img" aria-labelledby="title desc">
<title id="title">Engineering approach: Understand, Assess, Engineer, Assure</title>
<desc id="desc">Four connected stages. Understand systems, functions, assets and interfaces. Assess threats, vulnerabilities, likelihood and risk. Engineer architecture, controls, zones and conduits. Assure through review, testing and evidence.</desc>
