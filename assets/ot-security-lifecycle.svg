<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Swanoop Ramakrishnan, OT and ICS Cyber Security Engineer</title>
  <desc id="desc">An animated industrial cyber security lifecycle showing Understand, Assess, Engineer and Assure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131c"/>
      <stop offset="0.55" stop-color="#0a1a25"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d6c7"/>
      <stop offset="0.55" stop-color="#53a9ff"/>
      <stop offset="1" stop-color="#f1b84b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#20d6c7" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#20d6c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8db1c5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: IBM Plex Mono, Consolas, monospace; }
      .muted { fill: #86a0b2; }
      .label { fill: #d9e8f0; font-weight: 650; letter-spacing: 1.2px; }
      .detail { fill: #8fa9b9; font-size: 13px; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="20" fill="url(#grid)"/>
  <path d="M0 105H160L205 70H350L395 105H610L655 58H820L865 105H1200" fill="none" stroke="#5ab7d7" stroke-opacity="0.09" stroke-width="1.5"/>
  <path d="M0 125H245L282 155H520L565 118H760L810 154H1020L1060 126H1200" fill="none" stroke="#20d6c7" stroke-opacity="0.07"/>
  <g opacity="0.12" fill="none" stroke="#8fc5d8">
    <circle cx="160" cy="105" r="4"/><circle cx="350" cy="105" r="4"/><circle cx="610" cy="105" r="4"/><circle cx="820" cy="105" r="4"/><circle cx="1020" cy="154" r="4"/>
  </g>

  <text x="64" y="70" class="sans" fill="#f2f8fb" font-size="32" font-weight="720" letter-spacing="0.5">SWANOOP RAMAKRISHNAN</text>
  <text x="66" y="104" class="sans" fill="#56d7cc" font-size="18" font-weight="600" letter-spacing="2.4">OT / ICS CYBER SECURITY ENGINEER</text>
  <text x="66" y="139" class="sans muted" font-size="15">Risk Assessment  ·  Secure Architecture  ·  Engineering Assurance  ·  Security Testing</text>

  <g transform="translate(64 190)">
    <rect width="1072" height="184" rx="16" fill="#08141e" fill-opacity="0.88" stroke="#6a9db4" stroke-opacity="0.2"/>
    <text x="24" y="30" class="mono" fill="#6f8fa1" font-size="11" letter-spacing="1.8">INDUSTRIAL CYBER SECURITY LIFECYCLE</text>
    <line x1="105" y1="94" x2="967" y2="94" stroke="#2a4657" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="94" x2="967" y2="94" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 15">
      <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="3.5s" repeatCount="indefinite"/>
    </line>

    <circle r="25" fill="url(#glow)" filter="url(#softGlow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M105 94H967"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#dffefa" filter="url(#softGlow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M105 94H967"/>
    </circle>

    <g transform="translate(105 94)">
      <circle r="31" fill="#0c2029" stroke="#20d6c7" stroke-width="2"/>
      <circle r="22" fill="none" stroke="#20d6c7" stroke-opacity="0.25"><animate attributeName="r" values="22;29;22" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="4s" repeatCount="indefinite"/></circle>
      <path d="M-10 1l7 7 14-17" fill="none" stroke="#87eee6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="55" text-anchor="middle" class="sans label" font-size="14">UNDERSTAND</text>
      <text x="0" y="76" text-anchor="middle" class="sans detail">System · Functions · Interfaces</text>
    </g>

    <g transform="translate(392 94)">
      <circle r="31" fill="#0c2029" stroke="#38c6d5" stroke-width="2"/>
      <circle r="12" fill="none" stroke="#a5edf3" stroke-width="2"/><line x1="9" y1="9" x2="18" y2="18" stroke="#a5edf3" stroke-width="3" stroke-linecap="round"/>
      <text x="0" y="55" text-anchor="middle" class="sans label" font-size="14">ASSESS</text>
      <text x="0" y="76" text-anchor="middle" class="sans detail">Threats · Exposure · Risk</text>
    </g>

    <g transform="translate(680 94)">
      <circle r="31" fill="#0c2029" stroke="#4faff4" stroke-width="2"/>
      <path d="M0-17l16 7v10c0 11-7 18-16 23C-9 18-16 11-16 0v-10z" fill="none" stroke="#aad7fa" stroke-width="2"/><path d="M-7 1l5 5 10-12" fill="none" stroke="#aad7fa" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="55" text-anchor="middle" class="sans label" font-size="14">ENGINEER</text>
      <text x="0" y="76" text-anchor="middle" class="sans detail">Architecture · Controls · Resilience</text>
    </g>

    <g transform="translate(967 94)">
      <circle r="31" fill="#0c2029" stroke="#f1b84b" stroke-width="2"/>
      <path d="M-14 10V-8h28v18M-18 10h36M-9-2h18M-9 4h12" fill="none" stroke="#ffe0a1" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="55" text-anchor="middle" class="sans label" font-size="14">ASSURE</text>
      <text x="0" y="76" text-anchor="middle" class="sans detail">Review · Test · Evidence</text>
    </g>
  </g>

  <text x="600" y="407" text-anchor="middle" class="sans" fill="#8ca6b5" font-size="13" letter-spacing="0.25">Understand the system. Assess the risk. Engineer the controls. Assure the outcome.</text>
</svg>
